name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  engine-l1-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: test
      SEND_MODE: off
      CRM_WRITE_MODE: off
      SEND_ALLOWLIST: ""
      CRM_WRITE_ALLOWLIST: ""
      CLINICCARDS_BASE_URL: http://cassette.invalid
      SMS_PROVIDER_BASE_URL: http://cassette.invalid
      CLINICCARDS_TOKEN: test-cliniccards-token
      SMS_PROVIDER_API_KEY: test-sms-key
      TOKEN_PEPPER: test-token-pepper-32-bytes-min
      PHONE_PEPPER: test-phone-pepper-32-bytes-min
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}
      - run: corepack enable
      - run: corepack pnpm@10.22.0 install --frozen-lockfile
      - run: corepack pnpm@10.22.0 --filter dashboard exec playwright install --with-deps chromium
      - name: Prime Deno cache before network lockdown
        run: deno cache --lock=deno.lock supabase/functions/**/*.ts tests/**/*.ts
      - run: supabase start
      - name: Enable CI egress deny ring
        run: |
          set -euo pipefail
          sudo iptables -I OUTPUT ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT ! -o lo -j REJECT
      - name: Prove outbound network is denied
        run: |
          set -euo pipefail
          deno run --allow-net=1.1.1.1:80 --no-prompt - <<'TS'
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);
            try {
              const response = await fetch("http://1.1.1.1/ci-egress-negative-control", {
                signal: controller.signal,
              });
              console.error(`Unexpected outbound network access: HTTP ${response.status}`);
              Deno.exit(1);
            } catch (error) {
              if (error instanceof DOMException && error.name === "AbortError") {
                console.error("Outbound network probe timed out instead of being denied");
                Deno.exit(1);
              }
              console.log(`Outbound network denied: ${error}`);
            } finally {
              clearTimeout(timeout);
            }
          TS
      - run: deno fmt --check
      - run: deno lint
      - run: deno check supabase/functions/**/*.ts
      # `ubs` is a local-only dev meta-runner. CI keeps the covered gates explicit here.
      - run: deno task check:no-egress-static
      - run: deno test tests/unit
      - run: deno test --allow-run=docker tests/pgtap
      - run: deno test tests/integration
      - run: deno test tests/integration/no-egress.test.ts
      - run: corepack pnpm@10.22.0 --filter dashboard typecheck
      - run: corepack pnpm@10.22.0 --filter dashboard test:e2e
      - run: supabase db lint --local
      - run: supabase gen types --db-url 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --lang typescript --schema api,app,maintenance,private > supabase/functions/_shared/database.types.ts
      - run: deno fmt supabase/functions/_shared/database.types.ts
      - run: git diff --exit-code supabase/functions/_shared/database.types.ts
      - name: Disable CI egress deny ring
        if: always()
        run: |
          sudo iptables -D OUTPUT ! -o lo -j REJECT || true
          sudo ip6tables -D OUTPUT ! -o lo -j REJECT || true
