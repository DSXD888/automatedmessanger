feature: dentino-system
created: "2026-06-28"
generator: pipemaxxer
pattern: "A (research doc → full pipeline) with Strategy REUSE"
entry_point: "batch-1 (create spec)"

# ───────────────────────────────────────────────────────────────────────────
# Source-of-Truth model (3-SOT). The research doc is the architecture SoT and
# is NEVER duplicated; spec + TDD are created; strategy already exists & is REUSED.
# ───────────────────────────────────────────────────────────────────────────
sources:
  architecture_sot: docs/research/2026-06-16-dentino-appointment-messaging-research.md   # v2.26.3, ~1727 lines, ADR-001…024. CITE, never copy.
  ordering_sot:      docs/strategy/2026-06-27-dentino-layer-strategy.md                   # EXISTS. Reused for ordering only. Do NOT regenerate.
  constitutional:    AGENTS.md                                                            # RULE 1 (no delete) / RULE 2 (bead wrappers) / RULE 3 (live clinic)

# ───────────────────────────────────────────────────────────────────────────
# Outputs this pipeline creates. ONE spec, ONE TDD, ONE bead graph — system-wide.
# No separate architecture doc (research doc is the architecture SoT). No per-layer specs.
# ───────────────────────────────────────────────────────────────────────────
paths:
  spec:      docs/spec/2026-06-28-dentino-system-spec.md            # SOT #1 — WHAT. Requirement IDs + ACs. CITES research §refs/ADRs.
  tdd:       docs/tdd/2026-06-28-dentino-system-tdd.md              # SOT #2 — HOW TO VERIFY. Test IDs → spec reqs → CI tiers (research §6.5).
  bootstrap: docs/tdd/2026-06-28-dentino-bootstrap.md               # Environment/harness setup (genuinely-new; not a research duplicate).
  strategy:  docs/strategy/2026-06-27-dentino-layer-strategy.md     # SOT #3 — ORDER. REUSED as-is.
  kickoff:   docs/pipemaxxer/active/dentino-system-kickoff.md       # Agent onboarding (produced by /beads-to-execution at step 10).
  push:      docs/pipemaxxer/active/dentino-system-push.md          # Continuation nudge.
  status:    docs/pipemaxxer/active/dentino-system-status.yaml      # SOT pointer file.

bead:
  cli: br
  prefix: automatedmessanger
  claim_wrapper:    bin/br-claim       # RULE 2 — mandatory. Never raw `br update --status`.
  complete_wrapper: bin/br-complete    # RULE 2 — mandatory. Never raw `br close`.
  sync_wrapper:     bin/br-sync
  existing_beads_note: >
    The only existing beads are the CLOSED strategy-QA epic automatedmessanger-strat-root-qdv (+9 children).
    They are NOT implementation beads and do not collide with the new graph.

coordination:
  agent_mail: true
  project_key: /Users/dieterdanicek/Desktop/automatedmessanger

tech_stack:
  engine:    { runtime: deno, framework: hono, dir: supabase/functions }
  database:  { engine: postgres, dir: supabase/migrations, cli: "supabase db" }
  dashboard: { stack: nextjs, pkg_mgr: pnpm, dir: apps/dashboard }
  build_check:   "deno fmt --check && deno lint && deno check supabase/functions/**/*.ts && pnpm --filter dashboard typecheck"
  test_cmd:      "deno test tests/unit && deno test tests/pgtap && deno test tests/integration"
  no_egress_gate: "deno test tests/integration/no-egress.test.ts"   # RULE 3 mechanical proof. Removing a cassette must THROW.
  type_drift_gate: "supabase gen types typescript --local > supabase/functions/_shared/database.types.ts  # must be zero-diff (CI tier 7)"
  scan_cmd:      "ubs --ci --fail-on-warning $(git diff --name-only)"

# ───────────────────────────────────────────────────────────────────────────
# Handoff files (numbered run order). 06 is intentionally omitted — the strategy
# is reused, not created, so there is nothing to "optimize-create".
# ───────────────────────────────────────────────────────────────────────────
handoffs:
  - { n: "01", file: 01-create-spec.md,        skill: research-to-spec,       stop_after: false }
  - { n: "02", file: 02-optimize-spec.md,       skill: "(manual fresh-eyes)",  stop_after: false }
  - { n: "03", file: 03-create-tdd.md,          skill: spec-to-tdd,            stop_after: false }
  - { n: "04", file: 04-optimize-tdd.md,        skill: "(manual fresh-eyes)",  stop_after: false }
  - { n: "05", file: 05-reuse-strategy.md,      skill: "(manual validate/bind — REUSE existing strategy)", stop_after: false }
  - { n: "07", file: 07-create-beads.md,        skill: beads-from-sources,     stop_after: false }
  - { n: "08", file: 08-optimize-beads.md,      skill: "(manual fresh-eyes)",  stop_after: false }
  - { n: "09", file: 09-audit-beads.md,         skill: bead-plan-audit,        stop_after: true,  stop_reason: "Drift gate must pass 100% before execution" }
  - { n: "10", file: 10-generate-kickoff.md,    skill: beads-to-execution,     stop_after: true,  stop_reason: "MANDATORY STOP — human authorizes execution" }
  - { n: "11", file: 11-push.md,                skill: "(continuation nudge)", stop_after: false }
  - { n: "12", file: 12-completion-audit.md,    skill: bead-completion-audit,  stop_after: true,  stop_reason: "MANDATORY STOP — human triggers audit" }
  - { n: "13", file: 13-fix-beads-kickoff.md,   skill: "(template)",           stop_after: true,  stop_reason: "human authorizes fix execution" }
  - { n: "14", file: 14-fix-beads-push.md,      skill: "(continuation nudge)", stop_after: false }
  - { n: "15", file: 15-archive.md,             skill: "(manual archive)",     stop_after: false }

# ───────────────────────────────────────────────────────────────────────────
# Non-negotiable gates carried by EVERY handoff (see EXECUTION-GUIDE.md §Gates).
# ───────────────────────────────────────────────────────────────────────────
gates:
  zero_scope_drift: "100% of research feature surface (all 24 ADRs, every §3.1–§3.4 component/table/invariant) covered. Layers = execution ORDER, never importance tiers."
  rule_3_live_clinic: "Go-live SCAFFOLDING (mode flags, allowlist, APP_ENV boot guard, mode-flip audit, typed-confirm-token, guard-liveness) is in-scope build work. CLIMBING the ladder (shadow→seed→canary→full) is a runtime event — NEVER a bead. SEND_MODE/CRM_WRITE_MODE default off, fail-closed."
  lean_artifact: "No per-layer spec files, no duplicated research SQL/ADRs, no standalone cross-layer ledgers (strategy Execution Artifact Policy + AGENTS.md no-file-proliferation)."
  rule_2_wrappers: "bin/br-claim / bin/br-complete only. Agent Mail Start/Complete at both ends of every bead."
